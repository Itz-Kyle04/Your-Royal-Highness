<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Royal Highness – Till</title>
<style>
:root{--bg:#06100a;--card:#0d1a12;--gold:#d9b25f;--gold2:#f3d98b;--green:#2fae4e;--red:#d9534f;--tx:#f1ead6;--mut:#a89f84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
body{background:#030a05}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
header img{height:84px;border-radius:50%}
button,select,input{font:inherit;color:var(--tx)}
.ic{background:none;border:1px solid var(--gold);border-radius:10px;width:44px;height:44px;font-size:22px;color:var(--gold)}
main{flex:1;overflow-y:auto;padding:4px 14px 20px}
h2{color:var(--gold2);margin:8px 0;font-weight:normal}
.card{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:12px;margin:10px 0}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:1px solid var(--gold);background:#0b150e;font-size:18px;color:var(--gold2);cursor:pointer}
.btn.g{background:linear-gradient(#1d6b34,#12411f);border-color:#4fd36f}
.btn.r{border-color:var(--red);color:#ff8d89}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center}.stat b{display:block;color:var(--gold2);font-size:20px;margin-top:4px}.stat small{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);text-align:left;font-weight:normal}td,th{padding:7px 3px;border-bottom:1px solid #243a2b}td:last-child,th:last-child{text-align:right}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--gold);background:none;white-space:nowrap}.chip.on{background:#1d6b34}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prod{background:#0b150e;border:1px solid var(--gold);border-radius:12px;padding:6px;text-align:center;font-size:13px;cursor:pointer}
.prod img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#16301f;display:block}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--gold);background:#0b150e;margin:5px 0;font-size:16px}
.pay{padding:12px 4px}.pay.on{background:#1d6b34;border-color:#4fd36f}
#drawer{position:absolute;inset:0;z-index:9;display:none}#drawer.open{display:flex}
#drawer nav{width:230px;background:#08140c;border-right:1px solid var(--gold);padding:20px 10px;display:flex;flex-direction:column;gap:6px}
#drawer nav button{background:none;border:0;text-align:left;font-size:18px;padding:14px;border-radius:10px;color:var(--tx)}#drawer nav button.on{background:#1d6b34;color:var(--gold2)}
#drawer .sh{flex:1;background:#000a}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px}.bars div{flex:1;background:linear-gradient(var(--green),#145a2a);border-radius:3px 3px 0 0;min-height:2px}
.bl{display:flex;gap:4px;font-size:10px;color:var(--mut)}.bl span{flex:1;text-align:center;overflow:hidden}
.mut{color:var(--mut);font-size:13px}.x{background:none;border:0;color:#ff8d89;font-size:18px}
.q{display:flex;align-items:center;gap:6px}.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--gold);background:none;font-size:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d6b34;border:1px solid #4fd36f;padding:10px 18px;border-radius:20px;display:none;z-index:20}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}#app{z-index:1}
header img{height:120px;border-radius:0;mix-blend-mode:screen}
.card{background:linear-gradient(160deg,rgba(14,32,21,.9),rgba(5,13,8,.92));border:1px solid #b8923f;box-shadow:0 0 14px rgba(217,178,95,.2),inset 0 0 14px rgba(0,0,0,.55)}
.btn{background:linear-gradient(#10230f,#06110a);border:1px solid #d9b25f;box-shadow:0 0 12px rgba(217,178,95,.3),inset 0 0 8px rgba(217,178,95,.08);letter-spacing:.5px}
.btn.g{background:linear-gradient(#22823d,#0f4a22);border-color:#5fe07f;box-shadow:0 0 16px rgba(47,174,78,.55)}
.btn.r{box-shadow:0 0 12px rgba(217,83,79,.35)}
h2{background:linear-gradient(#f9e7a8,#c99a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.prod,.chip,input,select,.ic{border-color:#b8923f;box-shadow:0 0 8px rgba(217,178,95,.18)}
.chip.on,.pay.on{background:linear-gradient(#22823d,#0f4a22);border-color:#5fe07f}
#drawer nav{background:linear-gradient(#08170d,#030a05);box-shadow:0 0 24px rgba(217,178,95,.3)}

<main id="m"></main>
<div id="drawer"><nav id="nv"></nav><div class="sh" id="sh"></div></div>
</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'R'+(+n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const CATS=['Flower','Pre Rolls','Consumables','Concentrates','Accessories'],STAFF=['Candice','Wayne','Kyle'];
const S={products:[],tabs:[],sales:[],days:[],backups:[]};let db=null,view='till',cat='All',cart={},pay='Cash',who='',tabWho='',range='Today',newImg='';
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
/* storage: shared db when available, else this browser only */
const ls=n=>{try{return JSON.parse(localStorage.getItem('yrh_'+n)||'[]')}catch(e){return[]}};
function put(n,id,o){if(db)return db.collection(n).doc(id).set(o);const a=S[n].filter(x=>x.id!==id);a.push({id,...o});S[n]=a;try{localStorage.setItem('yrh_'+n,JSON.stringify(a))}catch(e){}ref()}
function del(n,id){if(db)return db.collection(n).doc(id).delete();S[n]=S[n].filter(x=>x.id!==id);try{localStorage.setItem('yrh_'+n,JSON.stringify(S[n]))}catch(e){}ref()}
function ref(){if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))return;draw()}
(async()=>{await 0;try{db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){db=null}
for(const n of Object.keys(S)){if(db)db.collection(n).onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));rdy[n]=1;ref()},()=>{});else S[n]=ls(n)}
if(!db)toast('Saving on this phone only');draw()})();
/* helpers */
const allSales=()=>S.days.flatMap(d=>d.sales||[]).concat(S.sales);
const sum=(a,p)=>a.filter(s=>s.pay===p).reduce((x,s)=>x+s.total,0),tot=a=>a.reduce((x,s)=>x+s.total,0);
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
const cartItems=()=>Object.entries(cart).map(([id,q])=>{const p=S.products.find(x=>x.id===id);return p?{n:p.name,q,p:p.price,id}:null}).filter(Boolean);
const cartTotal=()=>cartItems().reduce((x,i)=>x+i.q*i.p,0);
function nav(v){view=v;$('#drawer').classList.remove('open');draw();$('#m').scrollTop=0}
$('#mb').onclick=()=>$('#drawer').classList.add('open');$('#sh').onclick=()=>$('#drawer').classList.remove('open');
function pie(a,b,c){const t=a+b+c||1,p=[a/t*100,b/t*100,c/t*100];return `<div style="width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--gold) 0 ${p[0]}%,var(--green) ${p[0]}% ${p[0]+p[1]}%,#999 ${p[0]+p[1]}% 100%);display:flex;align-items:center;justify-content:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--card)"></div></div>`}
function breakdown(a){const v=[['Cash',sum(a,'Cash'),'#d9b25f'],['Card',sum(a,'Card'),'#2fae4e'],['Tab',sum(a,'Tab'),'#9a9a9a']],T=v.reduce((x,y)=>x+y[1],0),C=251.33;let o=0;
const arcs=v.map(([n,x,c])=>{const l=T?x/T*C:0,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${c}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return s}).join('');
return `<div class="row" style="align-items:center"><svg viewBox="0 0 120 120" style="flex:0 0 130px;max-width:130px"><circle r="40" cx="60" cy="60" fill="none" stroke="#1b2a20" stroke-width="14"/>${arcs}<text x="60" y="58" text-anchor="middle" fill="#f3d98b" font-size="11">${R(T)}</text><text x="60" y="72" text-anchor="middle" fill="#a89f84" font-size="9">Total</text></svg><div style="flex:1.4">${v.map(([n,x,c])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #243a2b;font-size:14px"><span><span style="color:${c}">●</span> ${n}</span><span>${R(x)} <span class="mut">${T?Math.round(x/T*100):0}%</span></span></div>`).join('')}</div></div>`}
function breakdownOld(a){const c=sum(a,'Cash'),k=sum(a,'Card'),t=sum(a,'Tab'),T=c+k+t||1;return `<div class="row" style="align-items:center">${pie(c,k,t)}<div class="mut" style="flex:2;line-height:1.9"><span style="color:var(--gold)">●</span> Cash ${R(c)} (${Math.round(c/T*100)}%)<br><span style="color:var(--green)">●</span> Card ${R(k)} (${Math.round(k/T*100)}%)<br><span style="color:#999">●</span> Tab ${R(t)} (${Math.round(t/T*100)}%)</div></div>`}
function recent(a,n){return `<table><tr><th>Time</th><th>By</th><th>Method</th><th>Amount</th></tr>${a.slice().sort((x,y)=>y.t-x.t).slice(0,n||99).map(s=>`<tr onclick="showSale('${s.id}')" style="cursor:pointer"><td>${tm(s.t)}</td><td>${esc(s.staff||'')}</td><td>${s.pay}${s.tab?' · '+esc(s.tab):''}</td><td>${R(s.total)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">No sales yet today</td></tr>'}</table>`}
/* views */
const V={
till(){const s=S.sales;return `${bnr()}<div class="row"><button class="btn g" onclick="cart={};nav('sale')">New Sale</button><button class="btn" onclick="nav('cash')">Cash Up</button></div>
<div class="row"><div class="card stat"><small>Today’s Sales</small><b>${R(tot(s))}</b></div><div class="card stat"><small>Transactions</small><b>${s.length}</b></div></div>
<div class="card"><h2>Recent Transactions</h2>${recent(s,5)}</div><div class="card"><h2>Payment Breakdown</h2>${breakdown(s)}</div>`},
sale(){const ps=S.products.filter(p=>cat==='All'||p.cat===cat).sort((a,b)=>a.price-b.price),its=cartItems();
return `<h2>New Sale</h2><select onchange="who=this.value"><option value="">Who is serving?</option>${STAFF.map(n=>`<option ${who===n?'selected':''}>${n}</option>`).join('')}</select>
<div class="chips">${['All',...CATS].map(c=>`<button class="chip ${cat===c?'on':''}" onclick="cat='${c}';draw()">${c}</button>`).join('')}</div>
<div class="grid">${ps.map(p=>`<div class="prod" onclick="cart['${p.id}']=(cart['${p.id}']||0)+1;draw()">${p.img?`<img src="${p.img}">`:'<div class="ph"></div>'}${esc(p.name)}<br><b style="color:var(--gold2)">${R(p.price)}</b></div>`).join('')||'<p class="mut">No products here. Add them on the Products page.</p>'}</div>
<div class="card"><h2>Current Sale</h2>${its.map(i=>`<div class="q" style="justify-content:space-between;padding:6px 0"><span style="flex:1">${esc(i.n)}</span><button onclick="cart['${i.id}']--;if(!cart['${i.id}'])delete cart['${i.id}'];draw()">−</button>${i.q}<button onclick="cart['${i.id}']++;draw()">+</button><span style="width:80px;text-align:right">${R(i.q*i.p)}</span></div>`).join('')||'<p class="mut">Tap products to add them</p>'}
<h2 style="text-align:right">Total: ${R(cartTotal())}</h2>

async function xl(r){const z=await JSZip.loadAsync(TPL,{base64:true}),f=z.file('xl/worksheets/sheet1.xml'),x=await f.async('string'),E=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),L='ABCDEFGH',
c=(a,s,v)=>v==null?`<c r="${a}" s="${s}"/>`:typeof v==='number'?`<c r="${a}" s="${s}"><v>${v}</v></c>`:`<c r="${a}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${E(v)}</t></is></c>`,
row=(n,cs)=>`<row r="${n}">${cs.join('')}</row>`,o=[];
o.push(row(2,'BCDEFG'.split('').map(l=>c(l+2,1))));
[['Cash',sum(r,'Cash')],['Card',sum(r,'Card')],['Tab',sum(r,'Tab')],['TOTAL',tot(r)]].forEach((a,i)=>o.push(row(3+i,[c('B'+(3+i),2,a[0]),c('C'+(3+i),3,a[1])])));
o.push(row(8,[c('B8',4,'TRANSACTIONS'),c('C8',4)]));
o.push(row(9,['Date','Time','Staff','Payment','Tab Holder','Items','Amount'].map((t,i)=>c(L[i+1]+9,5,t))));
const T=r.slice().sort((a,b)=>a.t-b.t),nt=Math.max(11,T.length);
for(let i=0;i<nt;i++){const s=T[i],n=10+i,v=s?[dkey(s.t),tm(s.t),s.staff||'',s.pay,s.tab||'',s.items.map(q=>q.q+'x '+q.n).join('; '),s.total]:[];o.push(row(n,[0,1,2,3,4,5,6].map(k=>c(L[k+1]+n,6,v[k]))))}
const b0=10+nt+2,B=S.tabs,nb=Math.max(11,B.length);
o.push(row(b0,[c('B'+b0,7,'TAB BALANCES'),c('C'+b0,8)]));o.push(row(b0+1,[c('B'+(b0+1),5,'Customer'),c('C'+(b0+1),5,'Balance')]));
for(let i=0;i<nb;i++){const n=b0+2+i,t=B[i];o.push(row(n,[c('B'+n,6,t?t.name:null),c('C'+n,6,t?t.balance:null)]))}
const cols='<cols>'+[12,12,12,12,14,40,12].map((w,i)=>`<col min="${i+2}" max="${i+2}" width="${w}" customWidth="1"/>`).join('')+'</cols>',hd=x.slice(0,x.indexOf('<sheetData>'));
z.file('xl/worksheets/sheet1.xml',hd+cols+'<sheetData>'+o.join('')+`</sheetData><mergeCells count="2"><mergeCell ref="B8:C8"/><mergeCell ref="B${b0}:C${b0}"/></mergeCells><drawing r:id="rId1"/></worksheet>`);
return z.generateAsync({type:'uint8array'})}
async function saveSheet(r,base){try{await dl(base+'.xlsx',await xl(r));toast('Spreadsheet ready')}catch(e){save(csv(r),base+'.csv')}}
function exportAll(){const r=allSales();saveSheet(r,'YRH-All-Data-'+dkey(Date.now()))}
